<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="open.css">
</head>
<body>
    <main>
        <section class="images_section">
            <aside>
                <img src="images/side_image1.png" alt="Side Image 1"/>
                <img src="images/side_image2.png" alt="Side Image 2"/>
                <img src="images/side_image3.png" alt="Side Image 3"/>
                <img src="images/side_image4.png" alt="Side Image 4"/>
                <img src="images/side_image5.png" alt="Side Image 5"/>
                <img src="images/side_image6.png" alt="Side Image 6"/>
            </aside>
        <section class="image_container">
            <img src="./images/center_image.png" alt="Center Image">
        </section>
        </section>
    <section class="content">
        <div class="content_header">
            <p class="green-text">Sustainable Materials</p>
            <h1>Nike Revolution</h1>
            <h4>Men's Road Running Shoes</h4>
        </div>
        <section class="price_section">
            <h2>MRP -$200.50</h2>
            <div>
                <p>Inclusive of all taxes</p>
                <p>Also includes all applicable duties</p>
            </div>
        </section>
        <section class="variants_section">
            <img src="./images/variant1.png" alt="variant1">

        <section class="sizes">
            <div class="size">UK 6</div>
            <div class="size">UK 6.5</div>
            <div class="size">UK 7</div>
            <div class="size">UK 7.5</div>
        </section>
        <section class="button_container">
        <button class="add_to_bag">Add to Bag</button>
        <button class="wishlist">Wishlist</button>
        </section>
        </section>
    </section>
    </main>
</body>
</html>
